<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Olivia Wong — Design-led AI-native product builder</title>
  <desc id="desc">A luminous blue, pink, and violet glass-inspired portfolio header.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf8ff"/><stop offset=".48" stop-color="#fff8fc"/><stop offset="1" stop-color="#f1edff"/>
    </linearGradient>
    <radialGradient id="blue"><stop stop-color="#69c9ff" stop-opacity=".8"/><stop offset="1" stop-color="#69c9ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#ff94c8" stop-opacity=".68"/><stop offset="1" stop-color="#ff94c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#a58cff" stop-opacity=".58"/><stop offset="1" stop-color="#a58cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#63c7ff"/><stop offset=".5" stop-color="#ff92c6"/><stop offset="1" stop-color="#9b86ff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#654f89" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="520" rx="42" fill="url(#bg)"/>
  <circle cx="108" cy="72" r="235" fill="url(#blue)" filter="url(#blur)"/>
  <circle cx="1010" cy="60" r="270" fill="url(#pink)" filter="url(#blur)"/>
  <circle cx="940" cy="490" r="280" fill="url(#violet)" filter="url(#blur)"/>
  <path d="M-20 415 C240 332 337 492 590 402 S975 307 1230 402" fill="none" stroke="url(#line)" stroke-width="2" opacity=".44"/>
  <g filter="url(#shadow)">
    <rect x="62" y="56" width="1076" height="390" rx="34" fill="#fff" fill-opacity=".56" stroke="#fff" stroke-opacity=".92" stroke-width="2"/>
    <rect x="78" y="72" width="1044" height="358" rx="25" fill="none" stroke="#536176" stroke-opacity=".11"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#283446">
    <text x="118" y="132" font-size="18" font-weight="700" letter-spacing="4">OLIVIA WONG · 王奥莉</text>
    <text x="118" y="214" font-size="58" font-weight="750">Design-led, AI-native</text>
    <text x="118" y="281" font-size="58" font-weight="750">product builder.</text>
    <text x="120" y="332" font-size="21" fill="#526176">From problem framing and interaction design to working software.</text>
    <text x="120" y="373" font-size="19" fill="#637087">以设计为起点，用产品判断选择问题，用工程能力把体验真正做出来。</text>
  </g>
  <g transform="translate(908 160)">
    <circle cx="82" cy="82" r="90" fill="#fff" fill-opacity=".72" stroke="#fff" stroke-width="3"/>
    <circle cx="82" cy="82" r="100" fill="none" stroke="url(#line)" stroke-width="3" stroke-dasharray="3 10" opacity=".76"/>
    <path d="M34 89c9-37 25-58 50-61 28 1 45 24 48 62-7 39-25 58-50 59-28-2-43-22-48-60Z" fill="none" stroke="#75cfff" stroke-width="3"/>
    <path d="M51 80c8-6 15-7 23-2m17 0c8-5 15-4 22 2M65 111c12 9 24 9 36-1" fill="none" stroke="#75cfff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
